name: Refresh DG Tresor Snapshot

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download and parse DG Tresor
        run: node scripts/refresh-dg-tresor-snapshot.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dg-tresor-index.json data/dg-tresor-metadata.json
          git diff --staged --quiet || git commit -m "chore: refresh DG Tresor snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
